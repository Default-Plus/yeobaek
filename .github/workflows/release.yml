name: Release Desktop & Mobile Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and Lint
        run: |
          npm run typecheck
          npm run lint

      - name: Generate icon and export static Next.js app
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          npm run icon:generate
          npm run export:desktop

      - name: Build and publish Windows NSIS installer to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish always

  release-android:
    needs: release-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Export static bundle and sync Capacitor Android
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_MOBILE_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_GOOGLE_MOBILE_REDIRECT_URI }}
        run: |
          npm run icon:generate
          npm run export:desktop
          npx cap sync android

      - name: Decode Android Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured. Add Android signing secrets to build a signed release APK."
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d '\r\n' | base64 --decode > "${RUNNER_TEMP}/yeobaek-release.jks"

      - name: Build Signed Android Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/yeobaek-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::Signed app-release.apk was not generated. Verify Android signing secrets."
            exit 1
          fi

      - name: Clean up decoded Android Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/yeobaek-release.jks"

      - name: Rename and upload Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          APK_OUT="Yeobaek-${TAG_NAME}-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "${APK_OUT}"
          gh release upload "${TAG_NAME}" "${APK_OUT}" --clobber
